# Servidor de producción del frontend (lo usa Dockerfile.prod).
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Compresión: sirve los .gz ya generados si existen y comprime el resto al vuelo.
    # (Para Brotli hace falta el módulo ngx_brotli o una CDN delante; las CDN lo aplican solas.)
    gzip on;
    gzip_static on;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_vary on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;

    # Los archivos de /assets llevan un hash en el nombre: nunca cambian, así que el navegador
    # (y la CDN, si la hay) pueden guardarlos un año sin volver a preguntar.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # index.html no se guarda en caché: es lo que apunta a los assets nuevos tras cada despliegue.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Aplicación de una sola página: cualquier ruta devuelve index.html y React Router decide.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
